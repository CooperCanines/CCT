<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooper Canines Service Area Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --primary: #2ecc71;
            --orange: #e67e22;
            --bg-light: #121212;
            --text-dark: #ecf0f1;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 1rem;
            text-align: center;
            background-color: #1e1e1e;
            border-bottom: 1px solid #2c3e50;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--primary);
        }

        #map {
            flex: 1;
            width: 100%;
            background-color: #1a1a1a;
        }

        .leaflet-container {
            background: #1a1a1a !important;
        }
        
        .legend {
            background: rgba(30, 30, 30, 0.95);
            color: #ecf0f1;
            padding: 10px 14px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            line-height: 1.5;
            font-size: 0.9rem;
            border: 1px solid #2c3e50;
        }
        .legend i {
            width: 16px;
            height: 16px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cooper Canines - Service Area Coverage Map</h1>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Initialize map centered around the Delaware Valley region
        const map = L.map('map', {
            zoomControl: false
        }).setView([39.85, -75.10], 9);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Dark base tile layer (Esri Dark Gray)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 16
        }).addTo(map);

        // Target definitions
        const greenCounty = "Camden";
        
        // South Jersey counties (All 8 southern/central counties)
        const southJerseyCounties = ["Camden", "Gloucester", "Burlington", "Atlantic", "Cape May", "Cumberland", "Salem", "Ocean", "Mercer"];
        
        // Entire state of Delaware
        const delawareCounties = ["New Castle", "Kent", "Sussex"];
        
        // Eastern PA counties bordering NJ (Bucks, Philadelphia, Delaware, Montgomery, Chester, Northampton, Lehigh)
        const easternPaFips = ["42017", "42029", "42045", "42091", "42101", "42077", "42095"];

        // Style function based on precise geographical filters
        function styleFeature(feature) {
            const props = feature.properties;
            const countyName = (props.NAME || props.name || props.NAME_2 || props.COUNTY || "").replace(" County", "").trim();
            const stateFp = props.STATEFP;
            const countyFp = props.GEOID || (stateFp + (props.COUNTYFP || ""));

            // 1. Camden County gets outlined in Green
            if (stateFp === "34" && countyName === greenCounty) {
                return {
                    color: "#2ecc71",       // Bright green outline
                    weight: 3.5,
                    fillColor: "#e67e22",   // Orange fill interior
                    fillOpacity: 0.35
                };
            } 
            
            // 2. Rest of South Jersey, all of Delaware, and Eastern PA get Orange
            const isSouthJersey = (stateFp === "34" && southJerseyCounties.includes(countyName));
            const isDelaware = (stateFp === "10");
            const isEasternPa = (stateFp === "42" && easternPaFips.includes(countyFp));

            if (isSouthJersey || isDelaware || isEasternPa) {
                return {
                    color: "#d35400",       // Darker orange border
                    weight: 1.5,
                    fillColor: "#e67e22",   // Orange fill
                    fillOpacity: 0.28       // Faded orange tint
                };
            } 
            
            // 3. Everything else (untracked regions) hidden/faded away
            return {
                color: "#333333",
                weight: 0.5,
                fillColor: "#111111",
                fillOpacity: 0.05
            };
        }

        // Add popups
        function onEachFeature(feature, layer) {
            const props = feature.properties;
            const countyName = (props.NAME || props.name || props.NAME_2 || props.COUNTY || "County").replace(" County", "").trim();
            const stateFp = props.STATEFP;
            const countyFp = props.GEOID || (stateFp + (props.COUNTYFP || ""));

            const isPrimaryGreen = (stateFp === "34" && countyName === greenCounty);
            const isOrangeArea = (
                (stateFp === "34" && southJerseyCounties.includes(countyName)) || 
                (stateFp === "10") || 
                (stateFp === "42" && easternPaFips.includes(countyFp))
            );

            if (isPrimaryGreen) {
                layer.bindPopup(`<strong style="color: #2ecc71;">${countyName} County, NJ</strong><br>Primary Service Area (Green Outline / Orange Region)`);
            } else if (isOrangeArea) {
                const stateName = stateFp === "34" ? "New Jersey" : (stateFp === "10" ? "Delaware" : "Pennsylvania");
                layer.bindPopup(`<strong style="color: #e67e22;">${countyName} County, ${stateName}</strong><br>Limited Services Area`);
            } else {
                layer.bindPopup(`<strong>${countyName} County</strong><br>Outside Service Region`);
            }
        }

        // Fetch official US county shapes via public GeoJSON endpoint
        const geojsonUrl = 'https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-counties.json';

        fetch(geojsonUrl)
            .then(response => response.json())
            .then(data => {
                // Filter specifically to NJ (34), DE (10), and target PA counties (42)
                data.features = data.features.filter(feature => {
                    const stateFp = feature.properties.STATEFP;
                    const countyFp = feature.properties.GEOID || (stateFp + (feature.properties.COUNTYFP || ""));
                    
                    if (stateFp === "34" || stateFp === "10") return true; 
                    if (stateFp === "42" && easternPaFips.includes(countyFp)) return true; 
                    return false;
                });

                L.geoJSON(data, {
                    style: styleFeature,
                    onEachFeature: onEachFeature
                }).addTo(map);
            })
            .catch(err => console.error("Error loading map boundaries: ", err));

        // Map Legend
        const legend = L.control({position: 'topright'});
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'legend');
            const styleString = 'width: 16px; height: 16px; float: left; margin-right: 8px; opacity: 0.9; border-radius: 3px;';
            div.innerHTML = `
                <b>Service Legend</b><br>
                <i style="background: #e67e22; border: 2px solid #2ecc71; ${styleString}"></i> Camden County (Green Outline)<br>
                <i style="background: #e67e22; ${styleString}"></i> South Jersey, Delaware & Eastern PA<br>
            `;
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
