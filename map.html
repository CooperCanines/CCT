<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooper Canines Service Area Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --primary: #2ecc71;
            --bg-light: #121212;
            --text-dark: #ecf0f1;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 1rem;
            text-align: center;
            background-color: #1e1e1e;
            border-bottom: 1px solid #2c3e50;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--primary);
        }

        #map {
            flex: 1;
            width: 100%;
            background-color: #1a1a1a;
        }

        .leaflet-container {
            background: #1a1a1a !important;
        }
        
        .legend {
            background: rgba(30, 30, 30, 0.95);
            color: #ecf0f1;
            padding: 10px 14px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            line-height: 1.5;
            font-size: 0.9rem;
            border: 1px solid #2c3e50;
        }
        .legend i {
            width: 16px;
            height: 16px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cooper Canines - Service Area Coverage Map</h1>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Initialize map centered around the Delaware Valley region
        const map = L.map('map', {
            zoomControl: false
        }).setView([39.85, -75.10], 9);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Dark base tile layer (Esri Dark Gray)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 16
        }).addTo(map);

        // Primary counties to highlight in bright green
        const primaryCounties = ["Camden", "Gloucester", "Burlington"];

        // Lightweight regional boundary polygons (approximate county bounding geometry for reliable rendering)
        const regionData = {
            "type": "FeatureCollection",
            "features": [
                // --- PRIMARY GREEN COUNTIES ---
                {
                    "type": "Feature",
                    "properties": { "name": "Camden", "state": "New Jersey", "primary": true },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[[-75.10, 39.95], [-74.85, 39.90], [-74.75, 39.80], [-74.90, 39.70], [-75.15, 39.75], [-75.10, 39.95]]]
                    }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Gloucester", "state": "New Jersey", "primary": true },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[[-75.25, 39.90], [-75.10, 39.95], [-75.15, 39.75], [-74.90, 39.70], [-75.05, 39.60], [-75.35, 39.65], [-75.25, 39.90]]]
                    }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Burlington", "state": "New Jersey", "primary": true },
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [[[-75.05, 40.15], [-74.40, 40.05], [-74.30, 39.80], [-74.50, 39.65], [-74.85, 39.90], [-75.10, 39.95], [-75.05, 40.15]]]
                    }
                },
                // --- REST OF SOUTH NEW JERSEY ---
                {
                    "type": "Feature",
                    "properties": { "name": "Mercer", "state": "New Jersey", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-74.85, 40.35], [-74.55, 40.30], [-74.60, 40.15], [-75.05, 40.15], [-74.85, 40.35]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Ocean", "state": "New Jersey", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-74.45, 40.15], [-74.15, 40.05], [-74.10, 39.50], [-74.45, 39.50], [-74.45, 40.15]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Atlantic", "state": "New Jersey", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-74.90, 39.70], [-74.50, 39.65], [-74.40, 39.50], [-74.60, 39.30], [-74.90, 39.35], [-74.90, 39.70]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Salem", "state": "New Jersey", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-75.35, 39.65], [-75.05, 39.60], [-75.15, 39.45], [-75.55, 39.50], [-75.35, 39.65]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Cumberland", "state": "New Jersey", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-75.15, 39.45], [-74.90, 39.35], [-74.90, 39.20], [-75.30, 39.20], [-75.15, 39.45]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Cape May", "state": "New Jersey", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-74.90, 39.35], [-74.60, 39.30], [-74.75, 38.93], [-74.95, 39.10], [-74.90, 39.35]]] }
                },
                // --- DELAWARE ---
                {
                    "type": "Feature",
                    "properties": { "name": "New Castle", "state": "Delaware", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-75.78, 39.84], [-75.45, 39.84], [-75.50, 39.45], [-75.78, 39.45], [-75.78, 39.84]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Kent", "state": "Delaware", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-75.78, 39.45], [-75.40, 39.45], [-75.35, 38.90], [-75.78, 38.90], [-75.78, 39.45]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Sussex", "state": "Delaware", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-75.78, 38.90], [-75.35, 38.90], [-75.05, 38.45], [-75.78, 38.45], [-75.78, 38.90]]] }
                },
                // --- EASTERN PENNSYLVANIA (Bordering NJ) ---
                {
                    "type": "Feature",
                    "properties": { "name": "Philadelphia", "state": "Pennsylvania", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-75.28, 40.14], [-74.95, 40.10], [-75.08, 39.88], [-75.30, 39.93], [-75.28, 40.14]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Bucks", "state": "Pennsylvania", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-75.30, 40.60], [-74.88, 40.40], [-74.95, 40.10], [-75.28, 40.14], [-75.30, 40.60]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Montgomery", "state": "Pennsylvania", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-75.60, 40.50], [-75.30, 40.60], [-75.28, 40.14], [-75.60, 40.05], [-75.60, 40.50]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Delaware (PA)", "state": "Pennsylvania", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-75.60, 40.05], [-75.28, 40.14], [-75.30, 39.80], [-75.55, 39.80], [-75.60, 40.05]]] }
                },
                {
                    "type": "Feature",
                    "properties": { "name": "Chester", "state": "Pennsylvania", "primary": false },
                    "geometry": { "type": "Polygon", "coordinates": [[[-76.00, 40.10], [-75.60, 40.05], [-75.55, 39.80], [-75.80, 39.72], [-76.00, 40.10]]] }
                }
            ]
        };

        // Style mapping function
        function styleFeature(feature) {
            if (feature.properties.primary) {
                return {
                    color: "#2ecc71",       // Bright green outline
                    weight: 3,
                    fillColor: "#2ecc71",
                    fillOpacity: 0.35       // Distinct green highlighting tint
                };
            } else {
                return {
                    color: "#444444",       // Faded grey border
                    weight: 1,
                    fillColor: "#1e293b",
                    fillOpacity: 0.12       // Subtle dark background tint
                };
            }
        }

        // Add popups
        function onEachFeature(feature, layer) {
            const props = feature.properties;
            if (props.primary) {
                layer.bindPopup(`<strong style="color: #2ecc71;">${props.name} County, ${props.state}</strong><br>Primary Service Area (Full In-Home Training)`);
            } else {
                layer.bindPopup(`<strong>${props.name} County, ${props.state}</strong><br>Limited Services Area`);
            }
        }

        // Load data directly into the map
        L.geoJSON(regionData, {
            style: styleFeature,
            onEachFeature: onEachFeature
        }).addTo(map);

        // Map Legend
        const legend = L.control({position: 'topright'});
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'legend');
            const styleString = 'width: 16px; height: 16px; float: left; margin-right: 8px; opacity: 0.9; border-radius: 3px;';
            div.innerHTML = `
                <b>Service Legend</b><br>
                <i style="background: #2ecc71; ${styleString}"></i> Primary Area (Camden, Gloucester, Burlington)<br>
                <i style="background: #1e293b; border: 1px solid #444; ${styleString}"></i> Limited / Rest of Region
            `;
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
