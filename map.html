<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooper Canines Service Area Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --primary: #2ecc71;
            --bg-light: #121212;
            --text-dark: #ecf0f1;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 1rem;
            text-align: center;
            background-color: #1e1e1e;
            border-bottom: 1px solid #2c3e50;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--primary);
        }

        #map {
            flex: 1;
            width: 100%;
            background-color: #1a1a1a;
        }

        /* Dark mode overrides for Leaflet controls */
        .leaflet-container {
            background: #1a1a1a !important;
        }
        
        .legend {
            background: rgba(30, 30, 30, 0.9);
            color: #ecf0f1;
            padding: 10px 14px;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(0,0,0,0.4);
            line-height: 1.4;
            font-size: 0.9rem;
            border: 1px solid #2c3e50;
        }
        .legend i {
            width: 16px;
            height: 16px;
            float: left;
            margin-right: 8px;
            opacity: 0.8;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cooper Canines - Service Area Coverage Map</h1>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Leaflet AJAX for loading GeoJSON easily -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>

<script>
        // Initialize map centered around the Delaware Valley region
        const map = L.map('map', {
            zoomControl: false
        }).setView([39.85, -75.10], 9);

        // Add custom zoom control position
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Use Esri's keyless dark/gray canvas tile layer
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            maxZoom: 16
        }).addTo(map);

        // Target primary counties to highlight in Green
        const primaryCounties = ["Camden", "Gloucester", "Burlington"];

        // Style function for regional counties
        function styleFeature(feature) {
            // Check multiple potential property keys used by various GeoJSON feeds
            const props = feature.properties;
            const countyName = props.NAME || props.name || props.NAME_2 || props.COUNTY || props.county || "";
            
            // Clean up name string just in case (e.g., "Camden County" -> "Camden")
            const cleanName = countyName.replace(" County", "").trim();

            if (primaryCounties.includes(cleanName)) {
                return {
                    color: "#2ecc71",       // Bright green outline
                    weight: 3,
                    fillColor: "#2ecc71",
                    fillOpacity: 0.35       // Highlighted interior tint
                };
            } else {
                return {
                    color: "#444444",       // Faded grey border for rest
                    weight: 1,
                    fillColor: "#1e293b",
                    fillOpacity: 0.12       // Faded background color
                };
            }
        }

        // Popups on click to display info
        function onEachFeature(feature, layer) {
            const props = feature.properties;
            const countyName = (props.NAME || props.name || props.NAME_2 || props.COUNTY || props.county || "County").replace(" County", "").trim();
            const stateCode = props.STATEFP === "34" ? "New Jersey" : (props.STATEFP === "10" ? "Delaware" : "Pennsylvania");
            
            if (primaryCounties.includes(countyName)) {
                layer.bindPopup(`<strong style="color: #2ecc71;">${countyName} County, ${stateCode}</strong><br>Primary Service Area (Full In-Home Training)`);
            } else {
                layer.bindPopup(`<strong>${countyName} County, ${stateCode}</strong><br>Limited Services Area`);
            }
        }

        // Fetching multi-state US counties GeoJSON data
        const geojsonUrl = 'https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-counties.json';

        const easternPaFips = ["42017", "42029", "42045", "42091", "42101", "42077", "42095"]; // Bucks, Chester, Delaware, Montgomery, Philadelphia, Lehigh, Northampton

        fetch(geojsonUrl)
            .then(response => response.json())
            .then(data => {
                data.features = data.features.filter(feature => {
                    const stateFp = feature.properties.STATEFP;
                    const countyFp = feature.properties.GEOID || (stateFp + (feature.properties.COUNTYFP || ""));
                    
                    if (stateFp === "34" || stateFp === "10") return true; 
                    if (stateFp === "42" && easternPaFips.includes(countyFp)) return true; 
                    return false;
                });

                L.geoJSON(data, {
                    style: styleFeature,
                    onEachFeature: onEachFeature
                }).addTo(map);
            })
            .catch(err => console.error("Error loading map boundaries: ", err));

        // Add a Map Legend
        const legend = L.control({position: 'topright'});
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'legend');
            styleString = 'width: 16px; height: 16px; float: left; margin-right: 8px; opacity: 0.8; border-radius: 3px;';
            div.innerHTML = `
                <b>Service Legend</b><br>
                <i style="background: #2ecc71; ${styleString}"></i> Primary Area (Camden, Gloucester, Burlington)<br>
                <i style="background: #1e293b; border: 1px solid #444; ${styleString}"></i> Limited / Rest of Region (PA & DE)
            `;
            return div;
        };
        legend.addTo(map);
    </script>

</body>
</html>
