<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooper Canines Service Area</title>
    <style>
        :root {
            --primary: #00793c;
            --accent: #2ecc71;
            --logo-orange: #e67e22;
            --bg-light: #121212;
            --text-dark: #ecf0f1;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .service-box {
            background-color: #1e1e1e;
            border: 1px solid #2c3e50;
            border-left: 5px solid var(--accent);
            padding: 2rem;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            line-height: 1.6;
        }

        .service-box h2 {
            color: var(--accent);
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 1px solid #2c3e50;
            padding-bottom: 0.5rem;
        }

        .service-box p {
            margin: 0.75rem 0;
            font-size: 1rem;
        }

        .service-box strong {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="service-box">
        <h2>Service Areas</h2>
        <p><strong>Primary Service Area:</strong> Camden County</p>
        <p><strong>Secondary Service Areas:</strong> Burlington, Gloucester</p>
        <p><strong>Limited Service Areas:</strong> South Jersey, Eastern PA, Delaware</p>
    </div>

</body>
</html>
