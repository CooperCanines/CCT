<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooper Canines Service Area Map & Forecast</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <style>
        :root {
            --primary: #2ecc71;
            --bg-light: #121212;
            --text-dark: #ecf0f1;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        header {
            padding: 1rem;
            text-align: center;
            background-color: #1e1e1e;
            border-bottom: 1px solid #2c3e50;
            z-index: 1000;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;
            color: var(--primary);
        }

        #map {
            flex: 1;
            width: 100%;
            background-color: #1a1a1a;
            z-index: 1;
        }

        .leaflet-container {
            background: #1a1a1a !important;
        }

        /* Floating Info Box in the Middle */
        .service-info-box {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            color: #ecf0f1;
            padding: 20px 22px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            z-index: 1000;
            border: 1px solid #2c3e50;
            max-width: 460px;
            width: 90%;
            text-align: left;
        }

        .service-info-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--primary);
            font-size: 1.1rem;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .service-info-box p {
            margin: 6px 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .service-info-box strong {
            color: #ffffff;
        }

        /* 7-Day Forecast Section Styling */
        .forecast-section {
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px dashed #333;
        }

        .forecast-section h4 {
            margin: 0 0 8px 0;
            font-size: 0.95rem;
            color: var(--primary);
            text-align: center;
        }

        .forecast-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 160px;
            overflow-y: auto;
        }

        .forecast-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 8px;
            border-radius: 4px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cooper Canines - Service Area Coverage</h1>
    </header>

    <div id="map"></div>

    <!-- Floating Service Box with 7-Day Forecast -->
    <div class="service-info-box">
        <h3>Service Coverage Areas</h3>
        <p><strong>Primary Service Area:</strong> Camden County</p>
        <p><strong>Secondary Service Areas:</strong> Burlington, Gloucester</p>
        <p><strong>Limited Service Areas:</strong> South Jersey, Eastern PA, Delaware</p>
        
        <div class="forecast-section">
            <h4>7-Day Regional Weather Forecast</h4>
            <div class="forecast-grid" id="forecastDisplay">
                Loading 7-day forecast...
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        // Initialize map centered around the Delaware Valley region
        const map = L.map('map', {
            zoomControl: false
        }).setView([39.85, -75.10], 9);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Dark base tile layer (Esri Dark Gray)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 16
        }).addTo(map);

        // Fetch Free 7-Day Daily Forecast from Open-Meteo for South Jersey coordinates
        async function loadWeeklyForecast() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=39.89&longitude=-75.07&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto');
                const data = await response.json();
                
                const times = data.daily.time;
                const maxTemps = data.daily.temperature_2m_max;
                const minTemps = data.daily.temperature_2m_min;
                const weatherCodes = data.daily.weather_code;

                let htmlContent = '';

                // Helper to map weather code numbers to text descriptions
                function getWeatherDescription(code) {
                    if (code === 0) return '☀️ Clear sky';
                    if (code >= 1 && code <= 3) return '⛅ Partly cloudy';
                    if (code >= 45 && code <= 48) return '🌫️ Foggy';
                    if (code >= 51 && code <= 67) return '🌧️ Rain showers';
                    if (code >= 71 && code <= 77) return '🌨️ Snow';
                    if (code >= 95) return '⛈️ Thunderstorm';
                    return '🌤️ Fair conditions';
                }

                for (let i = 0; i < times.length; i++) {
                    // Format date string nicely (e.g., "Mon, Sep 7")
                    const dateObj = new Date(times[i] + 'T00:00:00');
                    const options = { weekday: 'short', month: 'short', day: 'numeric' };
                    const formattedDate = dateObj.toLocaleDateString('en-US', options);

                    const conditionText = getWeatherDescription(weatherCodes[i]);
                    const maxT = Math.round(maxTemps[i]);
                    const minT = Math.round(minTemps[i]);

                    htmlContent += `
                        <div class="forecast-row">
                            <span><strong>${formattedDate}</strong> (${conditionText})</span>
                            <span>High: <strong>${maxT}°F</strong> | Low: ${minT}°F</span>
                        </div>
                    `;
                }

                document.getElementById('forecastDisplay').innerHTML = htmlContent;
            } catch (error) {
                console.error("Could not load 7-day forecast", error);
                document.getElementById('forecastDisplay').innerHTML = "7-day forecast currently unavailable.";
            }
        }

        loadWeeklyForecast();
    </script>
</body>
</html>
