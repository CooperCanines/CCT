<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide Title Here | Cooper Canines</title>
    <meta name="description" content="Dog training guide and advice from Cooper Canines.">

    <script>
        // 1. Redirect if opened directly outside of guides.html
        if (window.self === window.top) {
            const currentPath = window.location.pathname.substring(1); 
            window.location.href = '../guides.html?page=' + encodeURIComponent(currentPath);
        }

        // 2. Light/Dark Mode handling inside iframe
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        // Apply theme immediately on load from localStorage
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            applyTheme(savedTheme);
        });

        // Listen for live theme updates sent from guides.html
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'THEME_CHANGE') {
                applyTheme(event.data.theme);
            }
        });
    </script>

    <style>

        body {

        /* Dark Mode Styles */
        body.dark-mode {
