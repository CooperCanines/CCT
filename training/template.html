<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Article Template</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
            background-color: #ffffff;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Dark Mode Styles matching parent context */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        /* Responsive Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
    <script>
        // 1. Redirect to guides.html in root if this file is opened directly outside an iframe
        if (window.self === window.top) {
            let currentPath = window.location.pathname;
            
            // Standardize path by removing leading slash
            if (currentPath.startsWith('/')) {
                currentPath = currentPath.substring(1);
            }

            // Step out of training/ directory using ../ back to guides.html
            window.location.href = '../guides.html?page=' + encodeURIComponent(currentPath);
        }

        // 2. Theme Toggle Handler for Iframe Messaging
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark-mode');
            } else {
                document.body.classList.remove('dark-mode');
            }
        }

        // Apply saved theme preference immediately on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            applyTheme(savedTheme);
        });

        // Listen for postMessage theme updates sent from guides.html
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'THEME_CHANGE') {
                applyTheme(event.data.theme);
            }
        });
    </script>
</head>
<body>
    <div class="container">
        <h1>Training Article Title</h1>
        <p>This is a template for articles stored in the <code>training/</code> folder.</p>
        <p>When accessed directly, it will navigate up to <code>../guides.html</code> and pass its full path in the <code>?page=</code> query parameter.</p>
    </div>
</body>
</html>
