<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources & Guides - Cooper Canines</title>
    <style>
        :root {
            --header-bg-color: #009100;    
            --header-text-color: #ffffff;   
            --active-tab-color: #e67e22;    
            --bg-dark: #12181b;
            --card-bg: #1e262c;
            --text-light: #e0e6ed;
            --text-dark: #333333;
            --primary: #009100;
        }

        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: var(--text-dark); margin: 0; padding: 0; }
        
        /* Nav & Search Bar */
        .search-container { max-width: 800px; margin: 20px auto; padding: 0 15px; position: relative; }
        .search-box { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .search-results { 
            position: absolute; top: 100%; left: 15px; right: 15px; background: #fff; 
            border: 1px solid #ccc; border-top: none; max-height: 250px; overflow-y: auto; z-index: 1000; display: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-radius: 0 0 6px 6px;
        }
        .search-item { padding: 10px 15px; cursor: pointer; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .search-item:hover { background-color: #f0f0f0; }
        .search-item .type-badge { font-size: 0.75rem; padding: 3px 6px; border-radius: 4px; background: #e0e0e0; color: #555; }
        .search-item .type-badge.breed { background: #e8f5e9; color: #2e7d32; font-weight: bold; }

        /* Main Content Grid */
        .main-container { max-width: 1000px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
        .sidebar { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .nav-btn { display: block; width: 100%; padding: 10px; margin-bottom: 10px; background: var(--primary); color: white; border: none; border-radius: 5px; text-decoration: none; text-align: center; font-weight: bold; box-sizing: border-box; cursor: pointer; }
        .nav-btn:hover { background: #007a00; }
        
        .content-area { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        
        /* Suggestion Form Container */
        .suggestion-box { margin-top: 30px; padding: 20px; background: #f9f9f9; border-radius: 8px; border: 1px solid #e0e0e0; }
        .suggestion-box h3 { margin-top: 0; color: var(--primary); }
        .suggestion-box input, .suggestion-box textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .suggestion-box button { background: var(--primary); color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Unified Search Engine -->
    <div class="search-container">
        <input type="text" id="siteSearch" class="search-box" placeholder="Search articles, guides, or dog breeds..." onkeyup="handleSearch()">
        <div id="searchResults" class="search-results"></div>
    </div>

    <div class="main-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <a href="guides/template.html" class="nav-btn">Guides</a>
            <a href="training/template.html" class="nav-btn">Training</a>
            <a href="breeds.html" class="nav-btn">Breeds</a>
            <a href="guides/template.html" target="_blank" rel="noopener" class="nav-btn">External Links</a>
            <a href="guides/template.html" target="_blank" rel="noopener" class="nav-btn">External Links</a>
        </div>

        <!-- Main Content & Clean Suggestion Box -->
        <div class="content-area">
            <h2>Resources & Information Hub</h2>
            <p>Select a guide above or search for specific breeds and articles.</p>

            <!-- Suggestion Form (No Captcha + Native Web3Forms Botcheck) -->
            <div class="suggestion-box">
                <h3>Don't see what you're looking for?</h3>
                <p>Suggest a topic or ask a quick question, and we might feature it in our next guide!</p>
                
                <form action="https://api.web3forms.com/submit" method="POST">
                    <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                    
                    <!-- Web3Forms Native Honeypot Field (Invisible Bot Protection) -->
                    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email Address" required>
                    <textarea name="suggestion" rows="4" placeholder="What topic or breed guide would you like to see?" required></textarea>
                    
                    <button type="submit">Submit Suggestion</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let searchIndex = [
            { title: "Article 1", url: "guides/template.html", type: "Guide" },
            { title: "Article 2", url: "guides/template.html", type: "Guide" },
            { title: "Article 3", url: "guides/template.html", type: "Guide" }
        ];

        // Fetch breed list dynamically from components/breeds.json and index them
        window.addEventListener('DOMContentLoaded', () => {
            fetch('components/breeds.json')
                .then(response => response.json())
                .then(data => {
                    const breeds = data.breeds || data;
                    breeds.forEach(breed => {
                        searchIndex.push({
                            title: breed,
                            url: `breeds.html?search=${encodeURIComponent(breed)}`,
                            type: "Breed"
                        });
                    });
                })
                .catch(err => console.error('Error loading breeds for search:', err));
        });

        function handleSearch() {
            const query = document.getElementById('siteSearch').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('searchResults');
            resultsContainer.innerHTML = '';

            if (query.length < 2) {
                resultsContainer.style.display = 'none';
                return;
            }

            const matches = searchIndex.filter(item => item.title.toLowerCase().includes(query));

            if (matches.length > 0) {
                matches.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'search-item';
                    
                    const badgeClass = item.type === "Breed" ? "type-badge breed" : "type-badge";
                    div.innerHTML = `<span>${item.title}</span> <span class="${badgeClass}">${item.type}</span>`;
                    
                    div.onclick = () => {
                        window.location.href = item.url;
                    };
                    resultsContainer.appendChild(div);
                });
                resultsContainer.style.display = 'block';
            } else {
                resultsContainer.style.display = 'none';
            }
        }

        // Close search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                document.getElementById('searchResults').style.display = 'none';
            }
        });
    </script>
</body>
</html>
